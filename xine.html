></footer></aside>`}
function composer(){return `<section class="composer"><div class="composer-top">${avatar(user('you'))}<textarea id="compose" maxlength="280" rows="2" placeholder="What’s on your mind?" aria-label="Post text"></textarea></div><div class="composer-audience">${icon('globe')} Everyone can reply</div><div class="composer-bottom"><span class="composer-note">A thought. An idea. A little hello.</span><div class="compose-actions"><span id="count" class="char-count">0/280</span><button class="post-button" id="submit-post" disabled>Post ${icon('arrow')}</button></div></div></section>`}
function post(p){const u=user(p.author),minutes=Math.max(0,Math.floor((Date.now()-p.created)/60000)),time=minutes<1?'now':minutes<60?minutes+'m':minutes<1440?Math.floor(minutes/60)+'h':Math.floor(minutes/1440)+'d';return `<article class="post"><button class="post-avatar" data-profile="${u.id}" aria-label="View ${esc(u.name)}">${avatar(u)}</button><div class="post-content"><div class="post-head"><button data-profile="${u.id}" class="post-author">${esc(u.name)} ${u.verified?'<span class="verified">✓</span>':''}</button><span class="handle">@${esc(u.handle)}</span><span class="post-time">· ${time}</span><button class="post-menu" data-share="${p.id}" aria-label="Share post">${icon('more')}</button></div><p class="post-text">${esc(p.text).replace(/#(\w+)/g,'<span class="hashtag">#$1</span>')}</p>${p.media?.length?`<div class="post-media">${p.media.map(m=>m.kind==='video'?`<video controls preload="metadata" src="${esc(m.url)}" aria-label="${esc(m.alt||'Video')}"></video>`:`<img src="${esc(m.url)}" alt="${esc(m.alt||'Post image')}" loading="lazy">`).join('')}</div>`:''}${p.image?`<div class="post-image ${p.image}" role="img" aria-label="${p.image==='forest'?'Sunlight falling through a lush green forest':'Minimal warm concrete architecture'}"><span class="image-label">${p.image==='forest'?'THE ART OF NOTICING':'STUDIO NORTH / OBJECTS 024'}</span></div>`:''}<div class="post-actions"><button data-reply="${p.id}" aria-label="Reply">${icon('reply')}<span>${p.replyCount??(p.replies.length||'')}</span></button><button data-repost="${p.id}" class="${p.reposted?'reposted':''}" aria-label="Repost">${icon('repost')}<span>${p.reposts||''}</span></button><button data-like="${p.id}" class="${p.liked?'liked':''}" aria-label="${p.liked?'Unlike':'Like'}">${icon('heart')}<span>${p.likes||''}</span></button><button data-bookmark="${p.id}" class="${p.saved?'saved':''}" aria-label="${p.saved?'Remove bookmark':'Bookmark'}">${icon('bookmark')}</button><button data-share="${p.id}" aria-label="Share">${icon('share')}</button></div></div></article>`}
function profilePanel(){const u=user(profile);return `<div class="profile-banner"><span>Stay curious.</span>✳</div><section class="profile-info"><div class="profile-avatar-row">${avatar(u,'large')}${u.id==='you'?'<div class="profile-controls"><button class="outline-button" data-edit>Edit profile</button><button class="outline-button" data-logout>Sign out</button></div>':`<button class="outline-button" data-follow="${u.id}">${u.requested?'Requested':u.following?'Following':'Follow'}</button>`}</div><h2>${esc(u.name)}</h2><span class="muted">@${esc(u.handle)}</span>${u.id==='you'?`<div class="account-links"><a href="/account/2fa">Two-factor authentication</a><a href="/account/email">Email settings</a>${state.staff?'<a href="/admin">Administration</a>':''}</div>`:''}<p>${esc(u.bio)}</p><span class="muted">${u.followingCount||0} following · ${u.followers||0} followers</span></section><div class="profile-tabs">Posts</div>`}
function main(){let content='',title=view,subtitle='';if(view==='Home'){subtitle='A little more connection.';content=`<div class="feed-tabs"><button class="${tab==='For you'?'selected':''}" data-tab="For you">For you <span>✧</span></button><button class="${tab==='Following'?'selected':''}" data-tab="Following">Following</button><span class="feed-label">YOUR DAILY DOSE OF GOOD</span></div>${composer()}<div class="feed-divider"><span>${tab==='For you'?'A few things you might love':'From your people'}</span><span>✳</span></div>`}else if(view==='Profile')content=profilePanel();else if(view==='Explore'){subtitle='Follow your curiosity.';content=`<section class="explore-heading"><label class="search-box explore-search">${icon('search')}<input id="explore-search" placeholder="Search people and posts" aria-label="Search people and posts" value="${esc(search)}"></label><span class="eyebrow">THE WORLD, A LITTLE CLOSER</span><h2>${search?'Results for “'+esc(search)+'”':topic?'Exploring #'+esc(topic):'Find your next rabbit hole.'}</h2><div class="topic-chips">${['All','design','nature','creativity','architecture'].map(t=>`<button data-topic="${t==='All'?'':t}" class="${topic===t?'chosen':''}">${t}</button>`).join('')}</div></section>`}else if(view==='Bookmarks'){subtitle='Keep the things that stay with you.'}else if(view==='Notifications'){subtitle='Your corner, in the loop.';content=state.notifications.length?state.notifications.map(n=>`<button class="notification-item" data-notice="${esc(n.url)}">${icon(n.kind==='like'?'heart':n.kind==='follow'?'users':'reply')}<span>${esc(n.text)}<small>${new Date(n.at).toLocaleString()}</small></span></button>`).join(''):empty('bell','A little quiet, for now','When someone interacts with you, you’ll find it here.')}else if(view==='Connect'){subtitle='Good things start with good people.';content=`<div class="connect-intro"><span class="eyebrow">MAKE YOURSELF AT HOME</span><h2>Find your kind of people.</h2><p>Fresh perspectives. Shared interests. A few new hellos.</p></div>${state.users.filter(u=>u.id!=='you').map(u=>`<div class="connect-card"><button class="person" data-profile="${u.id}">${avatar(u,'large')}<span><strong>${esc(u.name)}</strong><small>@${esc(u.handle)}</small><p>${esc(u.bio)}</p></span></button><button class="outline-button" data-follow="${u.id}">${u.requested?'Requested':u.following?'Following':'Follow'}</button></div>`).join('')}`}
if(['Home','Explore','Bookmarks','Profile'].includes(view)){let posts=state.posts.filter(p=>view==='Bookmarks'?p.saved:view==='Profile'?p.author===profile:view==='Home'&&tab==='Following'?user(p.author).following||p.author==='you':true);if(view==='Explore'&&state.searchResults)posts=posts.filter(p=>state.searchResults.includes(p.id));if(view==='Explore'&&state.searchPeople?.length)content+=`<div class="search-people">${state.searchPeople.map(id=>{const u=user(id);return `<button class="person" data-profile="${u.id}">${avatar(u)}<span><strong>${esc(u.name)}</strong><small>@${esc(u.handle)}</small></span></button>`}).join('')}</div>`;content+=posts.length?posts.map(post).join(''):empty(view==='Bookmarks'?'bookmark':'search',view==='Bookmarks'?'A place for your favorites':'Nothing here just yet',view==='Bookmarks'?'Tap the bookmark on any post to save it for later.':'Share a thought, or explore something new.')}
return `<main class="main"><header class="main-header"><div><h1>${title}</h1>${subtitle?`<p>${subtitle}</p>`:''}</div><button class="header-flower" data-refresh aria-label="Refresh feed">✳</button></header>${content}<div class="feed-end">YOU’RE RIGHT WHERE YOU BELONG <span>✳</span></div></main>`}
function empty(i,t,d){return `<div class="empty">${icon(i)}<h2>${t}</h2><p>${d}</p></div>`}
function render(){app.innerHTML=`<div class="layout">${nav()}${main()}${right()}</div><button class="mobile-compose" data-compose aria-label="Create a post">${icon('plus')}</button>`;document.title=`Xine / ${view}`;bind()}
function navigate(n){view=n;topic='';search='';if(n==='Profile')profile='you';render();window.scrollTo(0,0);refresh()}
function openModal(html){modal.innerHTML=`<div class="modal-backdrop"><section class="modal-card" role="dialog" aria-modal="true"><button class="close-button" data-close aria-label="Close">${icon('close')}</button>${html}</section></div>`;modal.querySelector('[data-close]').onclick=()=>modal.innerHTML='';modal.querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))modal.innerHTML=''};modal.querySelector('textarea,input')?.focus()}
function bind(){document.querySelector('[data-refresh]').onclick=refresh;document.querySelectorAll('[data-logout]').forEach(logout=>logout.onclick=async()=>{try{await mutate('logout',{});state=null;modal.innerHTML='';await refresh()}catch(e){toast(e.message)}});document.querySelectorAll('[data-notice]').forEach(b=>b.onclick=()=>{const id=/\/status\/(\d+)/.exec(b.dataset.notice)?.[1];if(id)reply(id);else navigate('Connect')});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{profile=b.dataset.profile;view='Profile';render();window.scrollTo(0,0);refresh()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{topic=b.dataset.topic;search='';view='Explore';render();window.scrollTo(0,0);refresh()});document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async()=>{try{await mutate('follow',{id:b.dataset.follow});render()}catch(e){toast(e.message)}});for(const action of ['like','bookmark','repost'])document.querySelectorAll(`[data-${action}]`).forEach(b=>b.onclick=async()=>{try{await mutate(action,{id:b.dataset[action]});render()}catch(e){toast(e.message)}});document.querySelectorAll('[data-share]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(location.origin+'/post/'+b.dataset.share);toast('Post link copied')}catch{toast('Copy this link: '+location.origin+'/post/'+b.dataset.share)}});document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>reply(b.dataset.reply));document.querySelectorAll('[data-compose]').forEach(b=>b.onclick=()=>{openModal(`<h2>A little something to share?</h2>${composer()}`);bindComposer(modal)});document.querySelector('[data-theme]').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('xine-theme',document.body.classList.contains('dark')?'dark':'light')};document.querySelector('[data-about]').onclick=()=>openModal('<h2>A little more human.</h2><p>Be curious. Be kind. Respect other people’s privacy. Share your own work and give credit generously.</p><p class="muted">This standalone HTML is a local demo. Your changes stay in this browser when storage is available. Real accounts and shared posts require the Xine server.</p>');document.querySelector('[data-edit]')?.addEventListener('click',editProfile);document.querySelectorAll('#search,#explore-search').forEach(s=>s.onkeydown=e=>{if(e.key==='Enter'){search=s.value.trim();view='Explore';topic='';render();refresh()}});bindComposer(app)}
function bindComposer(root){const text=root.querySelector('#compose'),button=root.querySelector('#submit-post');if(!text)return;text.oninput=()=>{root.querySelector('#count').textContent=text.value.length+'/280';button.disabled=!text.value.trim()||posting};button.onclick=async()=>{if(posting)return;posting=true;button.disabled=true;try{await mutate('posts',{text:text.value});modal.innerHTML='';view='Home';tab='For you';render();toast('Your thought is out in the world.')}catch(e){toast(e.message);button.disabled=false}finally{posting=false}}}
async function reply(id){try{const r=await fetch('/api/thread/'+id);const thread=await r.json();if(!r.ok)throw Error(thread.error||'Could not open this conversation.');const p=thread.post;openModal(`<h2>The conversation</h2><p class="reply-original"><strong>${esc(thread.author.name)}</strong><br>${esc(p.text)}</p><div class="replies">${thread.replies.map(r=>`<div class="reply-item"><strong>${esc(r.author.name)}</strong> <span class="muted">@${esc(r.author.handle)}</span><p>${esc(r.text)}</p></div>`).join('')||'<p class="muted">Be the first to say hello.</p>'}</div><textarea class="dialog-textarea" maxlength="280" placeholder="Add your reply…" aria-label="Reply text"></textarea><button class="post-button" id="reply-send">Reply ${icon('arrow')}</button>`);document.querySelector('#reply-send').onclick=async()=>{const b=document.querySelector('#reply-send');b.disabled=true;try{await mutate('reply',{id,text:modal.querySelector('textarea').value});modal.innerHTML='';render();toast('Reply added')}catch(e){toast(e.message);b.disabled=false}}}catch(e){toast(e.message)}}
function editProfile(){const u=user('you');openModal(`<h2>Edit your profile</h2><label class="field">Name<input id="profile-name" maxlength="50" value="${esc(u.name)}"></label><label class="field">Bio<textarea id="profile-bio" maxlength="160">${esc(u.bio)}</textarea></label><button class="post-button" id="save-profile">Save changes</button>`);document.querySelector('#save-profile').onclick=async()=>{try{await mutate('profile',{name:document.querySelector('#profile-name').value,bio:document.querySelector('#profile-bio').value});modal.innerHTML='';render();toast('Profile updated')}catch(e){toast(e.message)}}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.innerHTML='';if(state&&e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();if(innerWidth<=820){if(view!=='Explore')navigate('Explore');document.querySelector('#explore-search').focus()}else document.querySelector('#search').focus()}});

function renderAuth(){document.title='Xine / '+(authMode==='signup'?'Join':'Sign in');modal.innerHTML='';const verifying=!!authChallenge,signup=authMode==='signup';app.innerHTML=`<main class="auth-layout"><section class="auth-story"><a class="brand" href="/"><span class="brand-mark">✳</span>xine<span class="brand-dot">.</span></a><span class="eyebrow">YOUR LITTLE CORNER OF THE INTERNET</span><h1>A little more<br>connection.</h1><p>Your people. Your ideas. Your kind of place.<br>Make yourself at home.</p><div class="auth-art"><span>✳</span><span>Stay curious.</span></div><small>Powered by Xitter · Open source, a little more human.</small></section><section class="auth-form-panel"><div class="auth-form-wrap"><span class="eyebrow">${verifying?'ONE MORE LITTLE STEP':signup?'GOOD THINGS START HERE':'GOOD TO SEE YOU'}</span><h2>${verifying?'Check your '+(authChallenge.kind==='totp'?'authenticator':'inbox'):signup?'Find your people.':'Welcome home.'}</h2><p class="muted">${verifying?(authChallenge.kind==='totp'?'Enter your authenticator code or a backup code.':'Enter the verification code sent to your email address.'):signup?'Create an account on this Xine instance.':'Sign in to your Xine account.'}</p><form id="auth-form">${verifying?`<label class="field">Verification code<input name="code" autocomplete="one-time-code" required autofocus maxlength="100"></label>`:`${signup?`<label class="field">Your name<input name="name" autocomplete="name" required maxlength="50"></label><label class="field">Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label>`:''}<label class="field">${signup?'Username':'Username or email'}<input name="username" autocomplete="username" required maxlength="${signup?'15':'64'}" ${signup?'pattern="[A-Za-z0-9_]{1,15}"':''}></label><label class="field">Password<input name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" required minlength="8" maxlength="256"></label>${signup&&authInfo.signupMode!=='open'?`<label class="field">Invite code<input name="invite" autocomplete="off" required placeholder="0000-0000" maxlength="30"></label>`:''}`}<p class="auth-error" role="alert" id="auth-error"></p><button class="post-button auth-submit" type="submit">${verifying?'Verify & continue':signup?'Create account':'Sign in'} ${icon('arrow')}</button></form>${verifying?'<button class="auth-switch" data-auth-back>Back to sign in</button>':`<p class="auth-switch">${signup?'Already part of the conversation?':'New around here?'} <button data-auth-switch>${signup?'Sign in':'Create an account'}</button></p>`}${signup&&authInfo.signupMode==='closed'?'<p class="muted">New sign-ups are currently closed by this instance’s administrator.</p>':''}<p class="auth-fine">Be curious. Be kind. Make room for others.<br>${signup&&!authInfo.mailEnabled?'Email verification is unavailable until this instance configures email delivery.':''}</p></div></section></main>`;
